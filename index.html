    --parquet-dim:#8a5f2c;
    --chalk:#eef1f4;
    --chalk-dim:#9aa7b2;
    --net-teal:#2a8f97;
    --c-point:#3fa34d;
    --c-free:#2a8f97;
    --c-covered:#e0a526;
    --c-blockpt:#c4392b;
    --c-dug:#d9722c;
    --c-error:#9c3140;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--court-ink);color:var(--chalk);font-family:'Inter',sans-serif;}
  .wrap{max-width:1200px;margin:0 auto;padding:20px 18px 60px;}

  /* header / scoreboard */
  .scoreboard{
    background:linear-gradient(180deg, var(--court-ink-2), var(--court-ink));
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px 22px;
    margin-bottom:18px;
    position:relative;
    overflow:hidden;
  }
  .scoreboard::before{
    content:"";
    position:absolute; left:0; right:0; top:0; height:4px;
    background:linear-gradient(90deg, var(--parquet-dim), var(--parquet), var(--parquet-dim));
  }
  .sb-top{display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:10px;}
  .sb-title{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:800;
    font-size:34px;
    letter-spacing:0.5px;
    text-transform:uppercase;
    color:var(--chalk);
    line-height:1;
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:4px;
  }
  .sb-sub{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    color:var(--parquet);
    letter-spacing:1.5px;
    text-transform:uppercase;
    margin-top:4px;
  }
  .sb-actions{display:flex; gap:8px;}
  .sync-pill{
    display:inline-flex; align-items:center; gap:6px;
    font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:0.5px;
    padding:4px 10px; border-radius:20px; border:1px solid var(--line); color:var(--chalk-dim);
    margin-left:10px; vertical-align:middle; text-transform:uppercase;
  }
  .sync-pill .dot{width:7px; height:7px; border-radius:50%; background:currentColor; flex-shrink:0;}
  .sync-pill.connected{color:var(--c-point); border-color:var(--c-point);}
  .sync-pill.connecting{color:var(--c-covered); border-color:var(--c-covered);}
  .sync-pill.error{color:var(--c-blockpt); border-color:var(--c-blockpt);}
  .sync-panel{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; display:none;
  }
  .sync-panel.open{display:block;}
  .sync-row{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px;}
  .sync-row input[type=text]{
    flex:1; min-width:220px; background:var(--court-ink); border:1px solid var(--line); border-radius:6px;
    color:var(--chalk); padding:8px 10px; font-size:13px; font-family:'JetBrains Mono',monospace;
  }
  .sync-row input[type=text]:focus{outline:none; border-color:var(--parquet);}
  .sync-status-line{font-size:12px; color:var(--chalk-dim); line-height:1.6;}
  .sync-status-line b{color:var(--chalk);}
  .btn{
    font-family:'Inter',sans-serif;
    font-size:13px;
    font-weight:600;
    padding:8px 14px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--chalk);
    cursor:pointer;
    transition:all .15s ease;
  }
  .btn:hover{border-color:var(--parquet); color:var(--parquet);}
  .btn:active{transform:scale(0.97);}
  .btn.warn:hover{border-color:var(--c-blockpt); color:var(--c-blockpt);}
  .btn.primary{background:var(--parquet); color:#20140a; border-color:var(--parquet);}
  .btn.primary:hover{color:#20140a; filter:brightness(1.08);}
  .btn:disabled{opacity:0.35; cursor:not-allowed;}

  /* section headers */
  .section-label{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:700;
    font-size:15px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--chalk-dim);
    margin:26px 0 10px;
    display:flex; align-items:center; gap:10px;
  }
  .section-label .num{color:var(--parquet); font-family:'JetBrains Mono',monospace; font-size:13px;}
  .section-label::after{content:""; flex:1; height:1px; background:var(--line);}

  /* setup panel */
  .session-date-row{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:10px 14px; margin-bottom:14px;
  }
  .session-date-row label{
    font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--chalk-dim);
    font-family:'JetBrains Mono',monospace;
  }
  .session-date-hint{font-size:11.5px; color:var(--chalk-dim); flex:1; min-width:200px;}
  .session-count{
    font-family:'JetBrains Mono',monospace; font-size:11.5px; color:var(--parquet);
    white-space:nowrap; padding:4px 10px; border:1px solid var(--line); border-radius:20px;
  }
  input[type=date]{
    background:var(--court-ink); border:1px solid var(--line); border-radius:6px;
    color:var(--chalk); padding:6px 9px; font-size:13px; font-family:'JetBrains Mono',monospace;
    cursor:pointer; color-scheme:dark;
  }
  input[type=date]:focus{outline:none; border-color:var(--parquet);}

  .setup{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; display:none;
  }
  .setup.open{display:block;}
  .setup-grid{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
  @media(max-width:720px){ .setup-grid{grid-template-columns:1fr;} }
  .setup-col h4{
    font-family:'Barlow Condensed',sans-serif; text-transform:uppercase; letter-spacing:1px;
    font-size:14px; color:var(--parquet); margin:0 0 10px;
  }
  .setup-row{display:flex; align-items:center; gap:8px; margin-bottom:7px;}
  .setup-row input[type=text]{
    flex:1; background:var(--court-ink); border:1px solid var(--line); border-radius:6px;
    color:var(--chalk); padding:7px 9px; font-size:13px; font-family:'Inter',sans-serif;
  }
  .setup-row input[type=text]:focus{outline:none; border-color:var(--parquet);}
  select{
    background:var(--court-ink); border:1px solid var(--line); border-radius:6px;
    color:var(--chalk); padding:7px 9px; font-size:13px; font-family:'Inter',sans-serif; cursor:pointer;
  }
  select:focus{outline:none; border-color:var(--parquet);}
  .team-toggle{display:flex; border-radius:6px; overflow:hidden; border:1px solid var(--line);}
  .team-toggle button{
    border:none; background:var(--court-ink); color:var(--chalk-dim); font-size:11.5px; font-weight:700;
    padding:6px 9px; cursor:pointer; font-family:'JetBrains Mono',monospace;
  }
  .team-toggle button.active-a{background:var(--net-teal); color:#fff;}
  .team-toggle button.active-b{background:var(--parquet); color:#20140a;}

  /* court panels */
  .courts{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media(max-width:820px){ .courts{grid-template-columns:1fr;} }
  .court{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px; position:relative;
  }
  .court.team-a{border-top:3px solid var(--net-teal);}
  .court.team-b{border-top:3px solid var(--parquet);}
  .court-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:8px;}
  .court-name{
    font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:19px; text-transform:uppercase; letter-spacing:1px;
  }
  .court.team-a .court-name{color:var(--net-teal);}
  .court.team-b .court-name{color:var(--parquet);}
  .setter-select label{font-size:11px; color:var(--chalk-dim); margin-right:6px; text-transform:uppercase; letter-spacing:1px;}

  .attacker-card{
    background:var(--court-ink); border:1px solid var(--line); border-radius:8px;
    padding:10px 12px; margin-bottom:8px;
  }
  .attacker-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .attacker-name{font-weight:600; font-size:14.5px;}
  .attacker-count{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--chalk-dim);}
  .code-row{display:flex; gap:5px; flex-wrap:wrap;}
  .code-btn{
    flex:1; min-width:38px;
    font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px;
    border-radius:6px; border:1px solid transparent; padding:7px 0; cursor:pointer;
    color:#fff; transition:transform .1s ease, filter .1s ease;
  }
  .code-btn:hover{filter:brightness(1.15);}
  .code-btn:active{transform:scale(0.92);}
  .code-btn.c-point{background:var(--c-point);}
  .code-btn.c-free{background:var(--c-free);}
  .code-btn.c-covered{background:var(--c-covered); color:#2a1c04;}
  .code-btn.c-blockpt{background:var(--c-blockpt);}
  .code-btn.c-dug{background:var(--c-dug);}
  .code-btn.c-error{background:var(--c-error);}
  .legend{
    display:flex; flex-wrap:wrap; gap:10px; margin:10px 0 0; font-size:11.5px; color:var(--chalk-dim);
  }
  .legend span.dot{display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px; vertical-align:middle;}

  .no-players{color:var(--chalk-dim); font-size:13px; font-style:italic; padding:8px 2px;}

  /* stats */
  .stats-controls{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px; align-items:center;}
  .stats-controls label{font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--chalk-dim); margin-right:4px;}

  .kpi-row{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:16px;}
  @media(max-width:720px){ .kpi-row{grid-template-columns:repeat(2,1fr);} }
  .kpi{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 14px;
  }
  .kpi .lbl{font-size:10.5px; text-transform:uppercase; letter-spacing:1.5px; color:var(--chalk-dim); font-family:'JetBrains Mono',monospace;}
  .kpi .val{font-family:'Barlow Condensed',sans-serif; font-size:30px; font-weight:800; margin-top:2px;}
  .kpi .val.pos{color:var(--c-point);}
  .kpi .val.eff{color:var(--parquet);}

  table.stat-table{width:100%; border-collapse:collapse; font-size:13px;}
  .table-wrap{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
  .table-scroll{overflow-x:auto;}
  table.stat-table th{
    text-align:left; padding:9px 10px; font-family:'JetBrains Mono',monospace; font-size:10.5px;
    text-transform:uppercase; letter-spacing:1px; color:var(--chalk-dim); border-bottom:1px solid var(--line);
    cursor:pointer; white-space:nowrap; background:var(--court-ink-2);
  }
  table.stat-table th:hover{color:var(--parquet);}
  table.stat-table td{padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap;}
  table.stat-table tr.agg-row{background:rgba(201,135,63,0.06); font-weight:700;}
  table.stat-table td.mono{font-family:'JetBrains Mono',monospace;}
  table.stat-table td.pos-cell{color:var(--c-point); font-weight:700; font-family:'JetBrains Mono',monospace;}
  table.stat-table td.eff-cell{color:var(--parquet); font-weight:700; font-family:'JetBrains Mono',monospace;}
  .bar-cell{width:90px;}
  .bar-track{height:6px; background:var(--court-ink); border-radius:3px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--c-point);}
  .bar-fill.eff{background:var(--parquet);}
  .empty-note{padding:20px; text-align:center; color:var(--chalk-dim); font-size:13px;}

  /* radar */
  .radar-wrap{display:grid; grid-template-columns:260px 1fr; gap:20px; align-items:center;}
  @media(max-width:720px){ .radar-wrap{grid-template-columns:1fr;} }
  .radar-controls{display:flex; flex-direction:column; gap:10px;}
  .radar-svg-box{background:var(--court-ink); border:1px solid var(--line); border-radius:8px; padding:8px; display:flex; justify-content:center;}
  .radar-legend{display:flex; gap:16px; font-size:12px; color:var(--chalk-dim); margin-top:8px;}
  .radar-legend span.sw{display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:middle;}
  .radar-mini-table{width:100%; font-size:12.5px; margin-top:10px; border-collapse:collapse;}
  .radar-mini-table th, .radar-mini-table td{padding:5px 8px; text-align:left; border-bottom:1px solid var(--line);}
  .radar-mini-table th{color:var(--chalk-dim); font-family:'JetBrains Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:1px;}

  /* export */
  .export-panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px; display:flex; flex-direction:column; gap:14px;}
  .export-row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .export-row input[type=text]{
    flex:1; min-width:220px; background:var(--court-ink); border:1px solid var(--line); border-radius:6px;
    color:var(--chalk); padding:8px 10px; font-size:13px; font-family:'JetBrains Mono',monospace;
  }
  .export-row input[type=text]:focus{outline:none; border-color:var(--parquet);}
  .export-note{font-size:11.5px; color:var(--chalk-dim); line-height:1.6;}

  /* radar section */
  .radar-wrap{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; display:grid; grid-template-columns:1fr 240px; gap:18px; align-items:center;
  }
  @media(max-width:720px){ .radar-wrap{grid-template-columns:1fr;} }
  .radar-controls{display:flex; align-items:center; gap:8px; margin-bottom:14px;}
  .radar-chart-box{display:flex; justify-content:center;}
  .radar-legend{display:flex; flex-direction:column; gap:10px;}
  .radar-legend-item{
    display:flex; align-items:center; gap:8px; font-size:12.5px; padding:8px 10px;
    background:var(--court-ink); border:1px solid var(--line); border-radius:8px;
  }
  .radar-legend-item .sq{width:11px; height:11px; border-radius:3px; flex-shrink:0;}
  .radar-legend-item .rl-name{font-weight:600; flex:1;}
  .radar-legend-item .rl-n{font-family:'JetBrains Mono',monospace; color:var(--chalk-dim); font-size:11px;}
  .radar-empty{color:var(--chalk-dim); font-size:13px; font-style:italic; grid-column:1/-1; text-align:center; padding:20px;}

  .toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    background:var(--panel); border:1px solid var(--parquet); color:var(--chalk);
    padding:9px 16px; border-radius:8px; font-size:13px; font-weight:600;
    opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
    font-family:'JetBrains Mono',monospace; z-index:50;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}
  .attacker-card{transition:border-color .15s ease, box-shadow .15s ease;}
  .attacker-card.last-hit{border-color:var(--parquet); box-shadow:0 0 0 1px var(--parquet), 0 0 16px rgba(201,135,63,.4); background:#1b1610;}
  .last-chip{display:inline-block; margin-right:8px; padding:2px 8px; border-radius:20px; background:var(--parquet); color:#20140a; font-weight:700; font-size:11px;}
  .code-btn.dimmed{opacity:.45;}
  .code-btn.pressed{outline:3px solid #fff; outline-offset:2px; transform:scale(1.12); box-shadow:0 0 16px rgba(255,255,255,.6); position:relative; z-index:1;}
  .code-btn.pressed::after{content:"\2713"; position:absolute; top:-9px; right:-7px; width:17px; height:17px; border-radius:50%; background:#fff; color:#10161d; font-size:11px; line-height:17px; text-align:center;}
</style>
